# Repo-wide gitleaks configuration. Every per-package security-secrets
# workflow points here, so a single source of truth covers api, ui,
# docs, and infra scans.
#
# Extends the default rule set with a narrow allowlist for known false
# positives in tests and lint-meta source:
#
# - Web Push test fixtures construct push subscription objects with
#   hand-rolled `p256dhKey` / `authKey` values like "secret-p256dh-key".
#   Real keys are base64url-encoded P-256 EC public points from the
#   browser; the `generic-api-key` rule misclassifies the literal
#   strings as leaked secrets.
# - One lint-meta rule file embeds the literal workspace marker
#   `infra/compose`, which the same default rule misclassifies in
#   git history.
#
# Production code with the same pattern still fails the scan.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and placeholder lookup tables that the env validator rejects in production are never real secrets."
paths = [
  '''apps/api/tests/api/notifications/notifications\.push\.utils\.test\.ts''',
  '''apps/api/tests/api/notifications/notifications\.push\.service\.test\.ts''',
  '''apps/ui/scripts/lint-meta/rules/source-text/no-cross-repo-import\.ts''',
  # validate.ts ships a PLACEHOLDER_SECRET_EXACT_MATCHES list of strings
  # the boot-time guard rejects in production (test JWT, compose
  # placeholders, the well-known test MFA encryption key). The list is
  # the deny-list, not a secret store.
  '''apps/api/src/config/env/validate\.ts''',
  # The validateEnv suite exercises every rejected placeholder + a real
  # synthetic MFA key as the "good" baseline. No live secret reaches
  # this file.
  '''apps/api/tests/config/env/validate\.test\.ts''',
]
# Historical finding from an MFA test stub that used a 16-char hex
# string as a placeholder `challengeToken` value. The working tree was
# updated to a clearly non-key string in a later commit; this
# fingerprint pins the historical hit so CI doesn't re-flag it.
commits = ["901fd55367183293112f393dbc4cb99127af3913"]
