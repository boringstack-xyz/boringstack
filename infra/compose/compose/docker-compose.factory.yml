# Factory slot overlay: merged by `bun run factory up` for each workspace's
# stack (tools/factory/workspace). It only changes where published ports bind:
# every slot port is on 127.0.0.1, so slots never answer on the network. The
# port numbers come from the slot (UI_HOST_PORT and friends, see
# compose.utils.ts); the developer's default stack does not merge this file.

services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"

  valkey:
    ports: !override
      - "127.0.0.1:${VALKEY_HOST_PORT:?}:6379"

  api-dev:
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:?}:7330"

  ui-dev:
    ports: !override
      - "127.0.0.1:${UI_HOST_PORT:?}:7331"
