# Mailpit — local SMTP catcher for testing transactional email flows.
#
# Captures every email the api sends (when EMAIL_PROVIDER=smtp + SMTP_HOST=mailpit),
# without ever delivering them. View the rendered HTML in the web UI at
# http://localhost:8025 — useful for iterating on email templates without
# bouncing through Resend/SendGrid/Cloudflare.
#
# Merged in by dev.sh when WITH_MAILPIT=1. Dev-only.
#
# https://mailpit.axllent.org

services:
  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    profiles: [mailpit]
    restart: unless-stopped
    # Defense-in-depth: block privilege escalation even on this dev-only
    # daemon, matching every other long-running service in the stack. (The
    # no-new-privileges guardrail renders prod overlays only, so it does not
    # enforce this here — we set it for consistency, not to satisfy a check.)
    security_opt:
      - no-new-privileges:true
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit_data:/data
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"   # SMTP
    networks:
      - backend
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${MAILPIT_LIMITS_CPUS:-0.25}"
          memory: "${MAILPIT_LIMITS_MEMORY:-128M}"
        reservations:
          cpus: "${MAILPIT_RESERVATIONS_CPUS:-0.05}"
          memory: "${MAILPIT_RESERVATIONS_MEMORY:-32M}"

volumes:
  mailpit_data:
