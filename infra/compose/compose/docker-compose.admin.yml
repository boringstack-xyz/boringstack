# LAN-only operator dashboard (apps/admin) and its admin API process.
# Merged by dev.sh when WITH_ADMIN=1. Off by default.
#
# Nothing here is routed by Traefik and nothing is published on a public
# address. Dev binds to 127.0.0.1. Prod binds to ADMIN_LAN_BIND, which defaults
# to 127.0.0.1, so the dashboard is reachable from the LAN only when the
# operator sets ADMIN_LAN_BIND to a LAN interface address on purpose. There is
# no login: the admin API acts as the platform admin resolved at boot
# (ADMIN_OPERATOR_USER_ID pins one when several exist).
#
# dev  (profile admin-dev):  admin-dev on http://127.0.0.1:7341 (Vite),
#                            admin-api-dev on http://127.0.0.1:7340.
# prod (profile admin-prod): admin on http://${ADMIN_LAN_BIND}:${ADMIN_HOST_PORT:-7342}
#                            (nginx), which proxies /api to the internal admin-api.

services:
  admin-api-dev:
    profiles: [admin-dev]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "bun run --watch src/admin.ts",
      ]
    volumes:
      - ../../../apps/api:/app
      - admin_api_dev_node_modules:/app/node_modules
      - ../../../packages:/packages:ro
    env_file:
      - path: ./api.dev.env
        required: false
    environment:
      NODE_ENV: development
      ADMIN_PORT: "7340"
      ADMIN_OPERATOR_USER_ID: ${ADMIN_OPERATOR_USER_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-app}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      CACHE_ENABLED: "true"
      CACHE_PROVIDER: valkey
      JWT_SECRET: ${API_DEV_JWT_SECRET:-docker-compose-api-dev-jwt-secret-keys}
      MFA_ENCRYPTION_KEY: ${API_DEV_MFA_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      FRONTEND_URL: ${ADMIN_DEV_FRONTEND_URL:-http://127.0.0.1:7341}
      PUBLIC_API_URL: ${API_DEV_PUBLIC_API_URL:-http://localhost:7331/api}
      EMAIL_PROVIDER: cloudflare
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_API_DEV_HOST_PORT:-7340}:7340"
    security_opt:
      - no-new-privileges:true

  admin-dev:
    profiles: [admin-dev]
    build:
      context: ../../../apps/admin
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app
    command: ["bun", "--no-install", "./node_modules/.bin/vite", "--host", "0.0.0.0"]
    volumes:
      - ../../../apps/admin:/app
      - admin_dev_node_modules:/app/node_modules
    environment:
      ADMIN_API_TARGET: http://admin-api-dev:7340
    depends_on:
      - admin-api-dev
    networks:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_DEV_HOST_PORT:-7341}:7341"
    security_opt:
      - no-new-privileges:true

  admin-api:
    profiles: [admin-prod]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.prod
      target: production
      additional_contexts:
        # Shared code (repo packages/), copied by the prod Dockerfile.
        packages: ../../../packages
    command: ["bun", "--no-install", "run", "dist/admin.js"]
    restart: unless-stopped
    env_file:
      - path: ./api.prod.env
        required: false
    environment:
      NODE_ENV: production
      ADMIN_PORT: "7340"
      ADMIN_OPERATOR_USER_ID: ${ADMIN_OPERATOR_USER_ID:-}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}"
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      CACHE_PROVIDER: valkey
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      api-migrate-prod:
        condition: service_completed_successfully
    networks:
      - backend
    # Internal only: no published port. The dashboard reaches it through nginx.
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7340/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${ADMIN_API_LIMITS_CPUS:-0.5}"
          memory: "${ADMIN_API_LIMITS_MEMORY:-256M}"

  admin:
    profiles: [admin-prod]
    build:
      context: ../../../apps/admin
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - admin-api
    networks:
      - backend
    ports:
      - "${ADMIN_LAN_BIND:-127.0.0.1}:${ADMIN_HOST_PORT:-7342}:8080"
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${ADMIN_LIMITS_CPUS:-0.25}"
          memory: "${ADMIN_LIMITS_MEMORY:-64M}"

volumes:
  admin_api_dev_node_modules:
  admin_dev_node_modules:
