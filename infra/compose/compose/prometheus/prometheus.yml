global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Traefik exposes Prometheus metrics on a dedicated entrypoint (:8899)
  # configured in docker-compose.yml. Internal docker DNS only — not
  # published to the host.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8899"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # apps/api exposes /metrics via prom-client (Node defaults + per-route
  # HTTP counter and duration histogram). Internal docker DNS — the
  # `api-dev` hostname resolves under the `frontend` network when the
  # dev profile is up; `api` (prod) is reachable on the same name when
  # the prod profile is up. Each target is labelled with its profile
  # so a Grafana dashboard can split or filter as the operator likes.
  - job_name: boringstack-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-dev:7330"]
        labels:
          profile: dev
      - targets: ["api:7330"]
        labels:
          profile: prod
