name: boringstack-infra

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_LIMITS_CPUS:-1.0}"
          memory: "${POSTGRES_LIMITS_MEMORY:-512M}"
        reservations:
          cpus: "${POSTGRES_RESERVATIONS_CPUS:-0.25}"
          memory: "${POSTGRES_RESERVATIONS_MEMORY:-128M}"

  valkey:
    image: valkey/valkey:8-alpine@sha256:b027235326507cfdade9b6684056ec1d0b0c0757412e628245129b5d7b788618
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Auth is enforced whenever VALKEY_PASSWORD is set (an empty
    # requirepass disables auth — the dev default). The API already
    # fail-closes on a missing password in production (env validate),
    # and dev.sh mirrors that for the stack; this makes the SERVER
    # enforce what the clients were already configured to send.
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD:-}"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      # $$-deferred so the container shell resolves the conditional:
      # authenticated ping when a password is set, plain ping otherwise.
      test:
        [
          "CMD-SHELL",
          'valkey-cli $${VALKEY_PASSWORD:+-a "$$VALKEY_PASSWORD"} ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_LIMITS_CPUS:-0.5}"
          memory: "${VALKEY_LIMITS_MEMORY:-256M}"
        reservations:
          cpus: "${VALKEY_RESERVATIONS_CPUS:-0.1}"
          memory: "${VALKEY_RESERVATIONS_MEMORY:-64M}"

  traefik:
    image: traefik:v3.7@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: boringstack-traefik
    profiles: [prod]
    # Root is required: the docker provider reads /var/run/docker.sock,
    # whose group id varies per host — an unprivileged uid would need a
    # host-specific group mapping and break the template's portability.
    # Root is neutered instead: every capability is dropped except binding
    # :80/:443, and no-new-privileges blocks escalation. An RCE in Traefik
    # gets a uid-0 process that cannot setuid, chown, ptrace, load
    # modules, or open raw sockets.
    user: root
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker.network=frontend"
      - "--entryPoints.metrics.address=:8899"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # Internal-only /ping endpoint (default entrypoint :8080, not
      # published) backing the container healthcheck below.
      - "--ping=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_LIMITS_CPUS:-0.5}"
          memory: "${TRAEFIK_LIMITS_MEMORY:-256M}"
        reservations:
          cpus: "${TRAEFIK_RESERVATIONS_CPUS:-0.1}"
          memory: "${TRAEFIK_RESERVATIONS_MEMORY:-64M}"

  api-migrate-dev:
    # Activated by both `dev` and `smoke` profiles — the smoke stack reuses
    # the dev-mode API + migrator and only swaps the UI for a pre-built
    # nginx-served bundle. See `ui-smoke` below.
    profiles: [dev, smoke]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/api:/app
      - api_dev_node_modules:/app/node_modules
    command:
      - "sh"
      - "-c"
      - "bun run db:push --force && bun run db:seed"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-app}
      NODE_ENV: development
      JWT_SECRET: api-migrate-placeholder-secret-padded-to-thirty-two
      FRONTEND_URL: http://localhost:7331
      ALLOWED_ORIGINS: ""
      PUBLIC_API_URL: http://localhost:7331/api
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${API_MIGRATE_LIMITS_CPUS:-0.5}"
          memory: "${API_MIGRATE_LIMITS_MEMORY:-512M}"

  api-migrate-prod:
    profiles: [prod]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    command:
      - "sh"
      - "-c"
      - "bun run db:migrate && bun run db:seed"
    env_file:
      - path: ./api.prod.env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}"
      NODE_ENV: production
      # No default. The env validator rejects empty / placeholder secrets
      # in production, so a missing JWT_SECRET / MFA_ENCRYPTION_KEY surfaces
      # the same loud error from the migrate task as from the main api.
      JWT_SECRET: ${JWT_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${API_MIGRATE_LIMITS_CPUS:-0.5}"
          memory: "${API_MIGRATE_LIMITS_MEMORY:-512M}"

  api-dev:
    profiles: [dev, smoke]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/api:/app
      - api_dev_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "bun run build:templates && bun run --watch src/index.ts",
      ]
    env_file:
      - path: ./api.dev.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-app}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      # MFA setup stages the encrypted secret in cache between
      # `/auth/mfa/setup` and `/auth/mfa/verify-setup`. With the
      # default noop cache the second call always returns "Enrollment
      # session expired" — surfaced by the smoke + Playwright gate.
      # Pinning Valkey here keeps every Valkey-backed feature
      # (cache, MFA staging, OAuth state, rate limit) on one provider
      # in dev/smoke.
      CACHE_ENABLED: ${API_DEV_CACHE_ENABLED:-true}
      CACHE_PROVIDER: ${API_DEV_CACHE_PROVIDER:-valkey}
      # Real-time notification stream. SSE multiplexes one open
      # connection per logged-in browser through Valkey pub/sub;
      # turning it on in dev so the operator can exercise the live
      # notification path without flipping a flag.
      NOTIFICATIONS_SSE_ENABLED: ${API_DEV_NOTIFICATIONS_SSE_ENABLED:-true}
      # Email provider defaults are profile-aware: dev.sh exports
      # smtp + mailpit when STACK=dev (so transactional mail is caught
      # at http://localhost:8025). Smoke doesn't run mailpit, so the
      # fallback is the schema default `cloudflare` (provider noops
      # with empty creds, which is the desired smoke behaviour).
      # SMTP_PORT must be a valid integer for the env validator; the
      # `25` fallback is harmless when EMAIL_PROVIDER != smtp.
      EMAIL_PROVIDER: ${API_DEV_EMAIL_PROVIDER:-cloudflare}
      SMTP_HOST: ${API_DEV_SMTP_HOST:-}
      SMTP_PORT: ${API_DEV_SMTP_PORT:-25}
      # VAPID keypair for Web Push. Generated by
      # scripts/dev-vapid-init.sh on first detached `up` and written
      # into compose/.env; all three are empty until then. The env
      # validator's invariant requires all-three-set or all-three-
      # empty (no partial config), so the default leaves the push
      # channel as a no-op until the init script seeds it.
      WEB_PUSH_VAPID_PUBLIC: ${WEB_PUSH_VAPID_PUBLIC:-}
      WEB_PUSH_VAPID_PRIVATE: ${WEB_PUSH_VAPID_PRIVATE:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      NODE_ENV: development
      BUN_ENV: development
      PORT: "7330"
      JWT_SECRET: ${API_DEV_JWT_SECRET:-docker-compose-api-dev-jwt-secret-keys}
      # AES-256-GCM key for MFA secret encryption. Base64 32 bytes.
      # Same shape as JWT_SECRET — dev/smoke gets a deterministic
      # placeholder so the smoke stack and Playwright e2e can enrol
      # MFA without a real secret in the box. Production sets
      # API_MFA_ENCRYPTION_KEY explicitly (or via secret manager
      # template); a deploy with the placeholder is detected by the
      # env validator's invariants check.
      MFA_ENCRYPTION_KEY: ${API_DEV_MFA_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      FRONTEND_URL: ${API_DEV_FRONTEND_URL:-http://localhost:7331}
      ALLOWED_ORIGINS: ${API_DEV_ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${API_DEV_PUBLIC_API_URL:-http://localhost:7331/api}
      E2E_TEST_ENDPOINTS_ENABLED: ${API_DEV_E2E_TEST_ENDPOINTS_ENABLED:-true}
      # The Playwright e2e suite registers + logs in dozens of times from a
      # single runner IP, blowing through the production 10 req/min default
      # on every CI run and turning every test failure into a misleading
      # "locator timeout" because the React app rendered an unauth blank
      # page after the api returned 429. Dev gets a generous ceiling;
      # production keeps the strict default.
      RATE_LIMIT_MAX: ${API_DEV_RATE_LIMIT_MAX:-10000}
      AUTH_RATE_LIMIT_MAX: ${API_DEV_AUTH_RATE_LIMIT_MAX:-10000}
      # Tempo trace export — empty when WITH_OBSERVABILITY=0 (the OTel
      # SDK then no-ops). Resolves to the observability overlay's
      # `tempo` service over the shared `backend` network.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${API_DEV_OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: ${API_DEV_OTEL_SERVICE_NAME:-boringstack-api-dev}
      # Auto-wired by scripts/glitchtip-fetch-dsn.sh after first up; empty
      # until that script writes a value into compose/.env. Sentry init
      # is a no-op when empty, so an unwired stack still boots cleanly.
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      api-migrate-dev:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7330/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - backend
      - frontend
    ports:
      - "${API_HOST_PORT:-7330}:7330"
    deploy:
      resources:
        limits:
          cpus: "${API_DEV_LIMITS_CPUS:-1.5}"
          memory: "${API_DEV_LIMITS_MEMORY:-1G}"
        reservations:
          cpus: "${API_DEV_RESERVATIONS_CPUS:-0.25}"
          memory: "${API_DEV_RESERVATIONS_MEMORY:-256M}"

  ui-dev:
    profiles: [dev]
    build:
      context: ../../../apps/ui
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/ui:/app
      - ui_dev_node_modules:/app/node_modules
    command: ["bun", "--no-install", "./node_modules/.bin/vite"]
    environment:
      CI: "true"
      VITE_API_URL: ""
      VITE_API_PROXY_TARGET: http://api-dev:7330
      # Auto-wired by scripts/glitchtip-fetch-dsn.sh after first up; empty
      # until that script writes a value into compose/.env. Vite picks
      # this up at dev-server startup and exposes it as import.meta.env.
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      # VAPID public key, populated by scripts/dev-vapid-init.sh. Must
      # match WEB_PUSH_VAPID_PUBLIC on the api side; the browser uses
      # this when subscribing to push.
      VITE_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC:-}
    depends_on:
      api-dev:
        condition: service_healthy
    networks:
      - frontend
    ports:
      - "${UI_HOST_PORT:-7331}:7331"
    deploy:
      resources:
        limits:
          cpus: "${UI_DEV_LIMITS_CPUS:-1.5}"
          memory: "${UI_DEV_LIMITS_MEMORY:-1G}"
        reservations:
          cpus: "${UI_DEV_RESERVATIONS_CPUS:-0.25}"
          memory: "${UI_DEV_RESERVATIONS_MEMORY:-256M}"

  ui-smoke:
    # Used by full-stack smoke (e2e) runs. Builds the production SPA
    # bundle with `Dockerfile.prod` and serves it through nginx with a
    # `/api/` reverse proxy to `api-dev`. Eliminates the Vite dev-server
    # cold-compile that pushed Playwright tests past their 30 s timeout
    # in CI — every page navigation now hits a static asset, sub-second.
    #
    # Local repro: `STACK=smoke ./dev.sh up -d --build`.
    profiles: [smoke]
    build:
      context: ../../../apps/ui
      dockerfile: Dockerfile.prod
      # Empty VITE_API_URL = same-origin: the SPA hits relative `/api/*`
      # paths and this service's nginx proxies them to api-dev.
      args:
        VITE_API_URL: ""
    restart: "no"
    logging: *default-logging
    volumes:
      - ../../../apps/ui/nginx.smoke.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - frontend
    ports:
      - "${UI_PREVIEW_HOST_PORT:-7331}:8080"
    deploy:
      resources:
        limits:
          cpus: "${UI_SMOKE_LIMITS_CPUS:-0.5}"
          memory: "${UI_SMOKE_LIMITS_MEMORY:-128M}"
        reservations:
          cpus: "${UI_SMOKE_RESERVATIONS_CPUS:-0.1}"
          memory: "${UI_SMOKE_RESERVATIONS_MEMORY:-32M}"

  api:
    profiles: [prod]
    image: ${API_IMAGE:-ghcr.io/${IMAGE_OWNER:-boringstack-xyz}/${API_IMAGE_NAME:-boringstack-api}:${API_IMAGE_TAG:-latest}}
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.prod
    labels:
      - "wud.watch=true"
      - "wud.trigger.include=docker.app,discord.1,slack.alerts"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      api-migrate-prod:
        condition: service_completed_successfully
    # Readiness, not liveness. The api starts listening before
    # `setupQueues()` resolves (see apps/api/src/index.ts) so `/health`
    # can flip green while BullMQ is still warming up — ui then boots
    # through `condition: service_healthy` and the first queue-backed
    # request 503s. `/ready` aggregates db + valkey + queue + email
    # checks and returns 503 until everything in the startup path is
    # `ok` or `degraded`. The api-dev profile keeps `/health` because
    # dev tolerates degraded optional features (e.g. noop email).
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7330/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    env_file:
      - path: ./api.prod.env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}"
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      # JWT revocation state (logout, per-jti blocklist) lives in the
      # cache; the env validator rejects production CACHE_ENABLED with
      # the per-process memory provider, so pin the shared Valkey here.
      CACHE_PROVIDER: ${CACHE_PROVIDER:-valkey}
      NODE_ENV: production
      BUN_ENV: production
      PORT: "7330"
      JWT_SECRET: ${JWT_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Traefik sits in front of the prod api on this profile, so the
      # rate limiter must key on X-Forwarded-For — otherwise every
      # client looks like the proxy IP and shares one bucket.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Tempo trace export. Defaults to the bundled `tempo` service on
      # the shared `backend` network; override (or set empty) to point
      # at a different collector or disable export entirely.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-boringstack-api}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${API_LIMITS_CPUS:-1.0}"
          memory: "${API_LIMITS_MEMORY:-512M}"
        reservations:
          cpus: "${API_RESERVATIONS_CPUS:-0.25}"
          memory: "${API_RESERVATIONS_MEMORY:-128M}"

  ui:
    profiles: [prod]
    image: ${UI_IMAGE:-ghcr.io/${IMAGE_OWNER:-boringstack-xyz}/${UI_IMAGE_NAME:-boringstack-ui}:${UI_IMAGE_TAG:-latest}}
    build:
      context: ../../../apps/ui
      dockerfile: Dockerfile.prod
      args:
        # Origin only — see compose/.env.example. The SPA appends /api/v1.
        VITE_API_URL: ${PUBLIC_API_URL:-}
        # Used by Stripe checkout return URLs + share links. Must equal the
        # API's FRONTEND_URL or `assertAllowedBillingRedirectUrl` rejects it.
        VITE_PUBLIC_URL: ${FRONTEND_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-BoringStack}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    labels:
      - "wud.watch=true"
      - "wud.trigger.include=docker.app,discord.1,slack.alerts"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    # Same /healthz probe as ui-smoke: nginx.conf serves `location = /healthz`
    # so `docker compose up --wait` has a readiness signal for the SPA too.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${UI_LIMITS_CPUS:-0.5}"
          memory: "${UI_LIMITS_MEMORY:-128M}"
        reservations:
          cpus: "${UI_RESERVATIONS_CPUS:-0.1}"
          memory: "${UI_RESERVATIONS_MEMORY:-32M}"

volumes:
  postgres_data:
  valkey_data:
  letsencrypt_data:
  api_dev_node_modules:
  ui_dev_node_modules:
