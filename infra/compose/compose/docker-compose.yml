name: ai-starter-infra

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_LIMITS_CPUS:-1.0}"
          memory: "${POSTGRES_LIMITS_MEMORY:-512M}"
        reservations:
          cpus: "${POSTGRES_RESERVATIONS_CPUS:-0.25}"
          memory: "${POSTGRES_RESERVATIONS_MEMORY:-128M}"

  valkey:
    image: valkey/valkey:8-alpine@sha256:b027235326507cfdade9b6684056ec1d0b0c0757412e628245129b5d7b788618
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_LIMITS_CPUS:-0.5}"
          memory: "${VALKEY_LIMITS_MEMORY:-256M}"
        reservations:
          cpus: "${VALKEY_RESERVATIONS_CPUS:-0.1}"
          memory: "${VALKEY_RESERVATIONS_MEMORY:-64M}"

  traefik:
    image: traefik:v3.7@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: ai-starter-traefik
    profiles: [prod]
    user: root
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker.network=frontend"
      - "--entryPoints.metrics.address=:8899"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_LIMITS_CPUS:-0.5}"
          memory: "${TRAEFIK_LIMITS_MEMORY:-256M}"
        reservations:
          cpus: "${TRAEFIK_RESERVATIONS_CPUS:-0.1}"
          memory: "${TRAEFIK_RESERVATIONS_MEMORY:-64M}"

  api-migrate-dev:
    profiles: [dev]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/api:/app
      - api_dev_node_modules:/app/node_modules
    command:
      - "sh"
      - "-c"
      - "bun run db:push --force && bun run db:seed"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-app}
      NODE_ENV: development
      JWT_SECRET: api-migrate-placeholder-secret-padded-to-thirty-two
      FRONTEND_URL: http://localhost:3001
      ALLOWED_ORIGINS: ""
      PUBLIC_API_URL: http://localhost:3001/api
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${API_MIGRATE_LIMITS_CPUS:-0.5}"
          memory: "${API_MIGRATE_LIMITS_MEMORY:-512M}"

  api-migrate-prod:
    profiles: [prod]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    command:
      - "sh"
      - "-c"
      - "bun run db:migrate && bun run db:seed"
    env_file:
      - path: ./api.prod.env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-migrate-placeholder-secret-padded-to-thirty-two-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://example.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://example.com/api}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${API_MIGRATE_LIMITS_CPUS:-0.5}"
          memory: "${API_MIGRATE_LIMITS_MEMORY:-512M}"

  api-dev:
    profiles: [dev]
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/api:/app
      - api_dev_node_modules:/app/node_modules
    command: ["bun", "run", "--watch", "src/index.ts"]
    env_file:
      - path: ./api.dev.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-app}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      NODE_ENV: development
      BUN_ENV: development
      PORT: "3000"
      JWT_SECRET: ${API_DEV_JWT_SECRET:-docker-compose-api-dev-jwt-secret-keys}
      FRONTEND_URL: ${API_DEV_FRONTEND_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${API_DEV_ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${API_DEV_PUBLIC_API_URL:-http://localhost:3001/api}
      E2E_TEST_ENDPOINTS_ENABLED: ${API_DEV_E2E_TEST_ENDPOINTS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      api-migrate-dev:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - backend
      - frontend
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "${API_DEV_LIMITS_CPUS:-1.5}"
          memory: "${API_DEV_LIMITS_MEMORY:-1G}"
        reservations:
          cpus: "${API_DEV_RESERVATIONS_CPUS:-0.25}"
          memory: "${API_DEV_RESERVATIONS_MEMORY:-256M}"

  ui-dev:
    profiles: [dev]
    build:
      context: ../../../apps/ui
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../../apps/ui:/app
      - ui_dev_node_modules:/app/node_modules
      - /app/.pnpm-store
    command: ["bun", "--no-install", "./node_modules/.bin/vite"]
    environment:
      CI: "true"
      VITE_API_URL: ""
      VITE_API_PROXY_TARGET: http://api-dev:3000
    depends_on:
      api-dev:
        condition: service_healthy
    networks:
      - frontend
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          cpus: "${UI_DEV_LIMITS_CPUS:-1.5}"
          memory: "${UI_DEV_LIMITS_MEMORY:-1G}"
        reservations:
          cpus: "${UI_DEV_RESERVATIONS_CPUS:-0.25}"
          memory: "${UI_DEV_RESERVATIONS_MEMORY:-256M}"

  api:
    profiles: [prod]
    image: ${API_IMAGE:-ghcr.io/${IMAGE_OWNER:-boringstack-xyz}/${API_IMAGE_NAME:-api-template}:${API_IMAGE_TAG:-latest}}
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.prod
    labels:
      - "wud.watch=true"
      - "wud.trigger.include=docker.app,discord.1,slack.alerts"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      api-migrate-prod:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    env_file:
      - path: ./api.prod.env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}"
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      NODE_ENV: production
      BUN_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${API_LIMITS_CPUS:-1.0}"
          memory: "${API_LIMITS_MEMORY:-512M}"
        reservations:
          cpus: "${API_RESERVATIONS_CPUS:-0.25}"
          memory: "${API_RESERVATIONS_MEMORY:-128M}"

  ui:
    profiles: [prod]
    image: ${UI_IMAGE:-ghcr.io/${IMAGE_OWNER:-boringstack-xyz}/${UI_IMAGE_NAME:-ui-template}:${UI_IMAGE_TAG:-latest}}
    build:
      context: ../../../apps/ui
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
    labels:
      - "wud.watch=true"
      - "wud.trigger.include=docker.app,discord.1,slack.alerts"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${UI_LIMITS_CPUS:-0.5}"
          memory: "${UI_LIMITS_MEMORY:-128M}"
        reservations:
          cpus: "${UI_RESERVATIONS_CPUS:-0.1}"
          memory: "${UI_RESERVATIONS_MEMORY:-32M}"

volumes:
  postgres_data:
  valkey_data:
  letsencrypt_data:
  api_dev_node_modules:
  ui_dev_node_modules:
