apiVersion: 1

# Datasource UIDs are pinned so any provisioned dashboard JSON can
# reference them by a stable identifier instead of relying on the
# random UID Grafana would otherwise mint per-environment.

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # `derivedFields` makes Loki log lines clickable: every parsed
      # `trace_id` becomes a link that opens the matching Tempo trace
      # in a new Explore tab. The regex matches the trace_id structured-
      # metadata field that Promtail's Pino pipeline emits.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace in Tempo"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # `tracesToLogsV2` lets a Tempo span (in the trace timeline view)
      # link out to the matching Loki log lines for the same trace_id.
      # Filters by `compose_service` for the api containers — the only
      # services we currently emit trace_id on.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{compose_service=~"api-dev|api"} | json | trace_id="$${__span.traceId}"'
        tags:
          - key: service.name
            value: compose_service
      # `tracesToMetrics` lets you jump from a span to the matching
      # Prometheus exemplar (request rate, latency histogram). Disabled
      # by default — we don't emit exemplars yet, but the wiring is
      # here for when we do.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
