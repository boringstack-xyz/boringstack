apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-network-policy
  namespace: boringstack
spec:
  podSelector:
    matchLabels:
      app: site
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browsers reach the static site only through the Traefik ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS only. The site makes no outbound or API calls at runtime.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
