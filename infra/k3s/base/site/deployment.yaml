apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: boringstack
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      serviceAccountName: site
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          securityContext:
            allowPrivilegeEscalation: false
            # The static site is baked into the image at build time (SITE_URL and
            # friends are validated there), so the container only serves files.
            # nginx writes its temp files and pid under /tmp, the only writable mount.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Built from apps/site/Dockerfile by apps-site-release.yml. The
          # overlay's images: entry rewrites the tag on every CI build.
          image: ghcr.io/boringstack-xyz/boringstack-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
