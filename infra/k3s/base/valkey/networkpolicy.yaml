apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-network-policy
  namespace: boringstack
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From the API and GlitchTip pods only.
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: glitchtip
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
