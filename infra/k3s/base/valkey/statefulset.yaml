apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: boringstack
  labels:
    app: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      serviceAccountName: valkey
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - valkey-server
          args:
            # Cache + BullMQ queue backend. Light persistence (RDB) to /data so
            # queued jobs survive a restart; flip --save "" + --appendonly no for
            # a pure cache. requirepass must equal the password the API sends.
            - --dir
            - /data
            - --save
            - "60"
            - "1000"
            - --appendonly
            - "no"
            - --maxmemory-policy
            - noeviction
            - --requirepass
            - $(VALKEY_PASSWORD)
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boringstack-secrets
                  key: VALKEY_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Storage class is a per-cluster knob, see infra/k3s/README.md.
        # Leave unset to use the cluster default, or set e.g. `longhorn`.
        # storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
