apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: boringstack
  labels:
    app: admin
spec:
  # ClusterIP and no Ingress: the dashboard is not published. Reach it with
  #   kubectl -n boringstack-prod port-forward svc/admin 8080:8080
  # (see infra/k3s/README.md, "Operator dashboard").
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: admin
