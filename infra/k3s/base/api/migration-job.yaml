apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrations
  namespace: boringstack
  annotations:
    # Runs before every sync, so schema is migrated before new pods roll out.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-migrations
    spec:
      restartPolicy: OnFailure
      serviceAccountName: api
      imagePullSecrets:
        - name: ghcr-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/boringstack-xyz/boringstack-api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "Running Drizzle migrations..."
              bun run db:migrate
              echo "Seeding..."
              bun run db:seed
              echo "Migrations complete."
          envFrom:
            - secretRef:
                name: boringstack-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boringstack-db-app
                  key: uri
            - name: VALKEY_HOST
              value: valkey
            - name: VALKEY_PORT
              value: "6379"
            - name: NODE_ENV
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
