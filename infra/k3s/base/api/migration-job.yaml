apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrations
  namespace: boringstack
  annotations:
    # A Sync hook at wave -1 runs after the database (wave -2) exists and
    # before the API Deployment (wave 0). It runs on every sync, so it must
    # only migrate. Never add db:seed or db:prepare here: they re-assert seed
    # data over admin edits. See infra/k3s/README.md, "Migrations and seeds".
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-migrations
    spec:
      # Release workflows publish linux/amd64 images only.
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: OnFailure
      serviceAccountName: api
      imagePullSecrets:
        - name: ghcr-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: migrate
          image: ghcr.io/boringstack-xyz/boringstack-migrations:latest
          imagePullPolicy: Always
          # ENTRYPOINT is dumb-init. The migrations image also runs
          # `bun run db:migrate` by default; this is explicit on purpose.
          args: ["bun", "run", "db:migrate"]
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          # Deliberately no envFrom: migrations need only the database
          # connection, so the app secret set (JWT, Stripe, email keys) is not
          # mounted into this pod.
          env:
            - name: TMPDIR
              value: /tmp
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boringstack-db-app
                  key: uri
            # Same CA as the API runtime client, so drizzle-kit verifies the
            # CNPG server certificate the same way (src/lib/postgres/connection.ts).
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: boringstack-db-ca
                  key: ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
