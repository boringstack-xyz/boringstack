apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boringstack-prod
  namespace: argocd
  # No argocd-image-updater annotations. Image digests are promoted by
  # .github/workflows/production-release.yml in one commit to
  # overlays/prod/kustomization.yaml, and that commit is what Argo syncs.
  # A per-image updater would ship one image ahead of the others.
spec:
  project: default
  source:
    # Your fork's repo. Add it to ArgoCD as a repo credential (SSH deploy key
    # for private repos).
    repoURL: git@github.com:boringstack-xyz/boringstack.git
    targetRevision: main
    path: infra/k3s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: boringstack-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
