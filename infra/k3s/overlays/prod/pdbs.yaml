apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: boringstack-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui-pdb
  namespace: boringstack-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ui
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: boringstack-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      cnpg.io/cluster: boringstack-db
