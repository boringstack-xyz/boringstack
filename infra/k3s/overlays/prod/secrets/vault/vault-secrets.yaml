apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: boringstack-secrets
spec:
  vaultAuthRef: vault-auth-kubernetes
  mount: secret
  type: kv-v2
  # KV-v2 path holding every app env key (JWT_SECRET, MFA_ENCRYPTION_KEY,
  # VALKEY_PASSWORD, email/OAuth/Stripe/VAPID keys, GLITCHTIP_* ...). See the
  # key list in infra/k3s/README.md. DATABASE_URL is NOT here, CNPG injects it.
  path: boringstack
  destination:
    name: boringstack-secrets
    create: true
    overwrite: true
    type: Opaque
    # REQUIRED here. VSO adds a `_raw` key holding the entire Vault response as
    # JSON. Workloads consume this Secret with `envFrom: secretRef`, so without
    # excludeRaw every secret would also land in one env var, JSON-encoded, in
    # every api and valkey pod. Node error pages and APM agents dump process.env.
    transformation:
      excludeRaw: true
  # Re-sync the k8s Secret (and roll consumers) when the Vault value changes.
  rolloutRestartTargets:
    - kind: Deployment
      name: api
    - kind: StatefulSet
      name: valkey
  refreshAfter: 1m
  hmacSecretData: true
