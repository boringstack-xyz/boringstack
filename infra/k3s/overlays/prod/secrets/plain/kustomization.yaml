apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Secret backend. Reads a gitignored secret.env (see README.md).
secretGenerator:
  - name: boringstack-secrets
    envs:
      - secret.env
    options:
      # Keep the name stable (no content-hash suffix) so the workloads'
      # static `boringstack-secrets` reference resolves.
      disableNameSuffixHash: true
  # Valkey reads VALKEY_PASSWORD from its own Secret (see
  # secrets/vault/vault-secrets.yaml); extra keys from the same file are unused.
  - name: boringstack-valkey
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true
