apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-worker
  namespace: boringstack-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip
      component: worker
  template:
    metadata:
      labels:
        app: glitchtip
        component: worker
    spec:
      imagePullSecrets:
        - name: ghcr-registry-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glitchtip-worker
          image: glitchtip/glitchtip:6.1.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["./bin/run-celery-with-beat.sh"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: boringstack-db-app
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: boringstack-db-app
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASS)@boringstack-db-rw:5432/glitchtip
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boringstack-secrets
                  key: VALKEY_PASSWORD
            - name: REDIS_URL
              value: redis://:$(VALKEY_PASSWORD)@valkey:6379/1
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: boringstack-secrets
                  key: GLITCHTIP_SECRET_KEY
            - name: GLITCHTIP_DOMAIN
              value: https://glitchtip.boringstack.example.com
            - name: DEFAULT_FROM_EMAIL
              value: noreply@example.com
            - name: EMAIL_URL
              valueFrom:
                secretKeyRef:
                  name: boringstack-secrets
                  key: GLITCHTIP_EMAIL_URL
                  optional: true
            - name: CELERY_WORKER_AUTOSCALE
              value: "1,3"
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: "10000"
          # The worker has no HTTP port and the image ships only python3, so
          # probe liveness by scanning /proc for the runworker process.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import os, sys
                  me = str(os.getpid())
                  def alive():
                      for pid in os.listdir("/proc"):
                          if not pid.isdigit() or pid == me:
                              continue
                          try:
                              with open(f"/proc/{pid}/cmdline", "rb") as fh:
                                  if b"runworker" in fh.read():
                                      return True
                          except OSError:
                              continue
                      return False
                  sys.exit(0 if alive() else 1)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
