name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Include enough detail to reproduce locally.

  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: "Login form submits twice on Safari when Enter is pressed in the password field"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/api
        - apps/ui
        - apps/docs
        - infra/compose
        - infra/bootstrap
        - other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be specific — exact URL, inputs, browser version.
      placeholder: |
        1. `./setup.sh --up`
        2. Open http://localhost:3001/login
        3. Sign in with demo credentials
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Chrome 138 / macOS 26.4 / bun 1.3.13"

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell

  - type: checkboxes
    id: regression
    attributes:
      label: Regression check
      options:
        - label: I searched existing issues for duplicates.
