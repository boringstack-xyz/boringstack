name: security-secrets

# One gitleaks scan for the whole repository. It replaces six per-app copies
# (api, ui, docs, site, infra-bootstrap, infra-compose) that each ran the same
# full-history `gitleaks detect --source .` on every PR they matched.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    # Forks always stay on GitHub-hosted runners (see AGENTS.md).
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10

    env:
      # scripts/ci/pre-push-security.sh reads this pin for local parity.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan every commit.
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "/tmp/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --exit-code=1

      # On a PR a leak already fails this job with the finding in its log, so the
      # SARIF upload only runs for main and for PRs that found something.
      - name: Upload SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || failure()) }}
        uses: github/codeql-action/upload-sarif@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          # Don't hold the job while GitHub processes the SARIF.
          wait-for-processing: false
          sarif_file: gitleaks-results.sarif
          category: gitleaks
        continue-on-error: true
