name: validate-compose

# Validates every docker-compose YAML and every meaningful overlay
# combination — without actually building images or booting services.
# Catches syntax errors, missing env vars, malformed Traefik labels, and
# overlay-merge regressions before they hit a developer's `up`.

on:
  push:
    branches: [main]
    paths:
      - "infra/compose/**"
      # Root gate scripts are validated here (shellcheck job) — keep the
      # trigger in lockstep so direct pushes touching them still run it.
      - "scripts/**"
      - "setup.sh"
      # The published installer at boringstack.xyz/install.sh. It is the first
      # command a new user or their agent runs, so it gets the same bar.
      - "apps/docs/public/install.sh"
      # The yamllint job lints every workflow file, so any workflow edit
      # must trigger this run — not just edits to this file.
      - ".github/workflows/**"
      # Prod Dockerfiles COPY the whole app context, so any app source
      # change can break the prod image build — not just Dockerfile or
      # lockfile edits.
      - "apps/api/**"
      - "apps/ui/**"
  pull_request:
    branches: [main]

concurrency:
  group: infra-compose-validate-compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-config:
    name: docker compose config (all overlay combinations)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # Build contexts point at monorepo apps (`../../../apps/api` and
    # `../../../apps/ui` from infra/compose/compose).

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'infra/compose/**'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Seed .env
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          cp .env.example .env
          # Required for STACK=prod + WITH_GLITCHTIP combinations:
          echo "GLITCHTIP_SECRET_KEY=$(openssl rand -base64 50 | tr -d '\n')" >> .env
          echo "GLITCHTIP_PUBLIC_HOST=glitchtip.example.com"                  >> .env
          echo "GLITCHTIP_BASIC_AUTH_USERS=user:placeholder"                  >> .env
          echo "GLITCHTIP_SUPERUSER_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=')" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=')"       >> .env

      - name: Validate — dev (base)
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            --profile dev config --quiet

      - name: Validate — prod (base)
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production-labels.yml \
            --profile prod config --quiet

      # Guardrail: every long-running prod-profile service in the base
      # compose file must define a healthcheck so `up --wait` and
      # service_healthy dependents have a readiness signal. One-shot jobs
      # (restart: "no", e.g. api-migrate-prod) exit by design and are
      # exempt; overlays ship sidecars and are not scanned.
      - name: Guardrail — prod services define healthchecks
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh healthchecks
        working-directory: infra/compose/compose
      - name: Guardrail — compose images digest-pinned, no floating latest
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh digest-pins
        working-directory: infra/compose/compose
      - name: Guardrail — no hardcoded credential fallbacks in compose
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh credential-fallbacks
        working-directory: infra/compose/compose
      - name: Guardrail — valkey enforces auth and prod requires the password
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh valkey-auth
        working-directory: infra/compose/compose
      - name: Guardrail — rooted prod services must drop capabilities
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh rooted-caps
        working-directory: infra/compose/compose
      - name: Guardrail — every service blocks privilege escalation
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh no-new-privileges
        working-directory: infra/compose/compose
      - name: Guardrail — long-running services reserve resources (no starvation)
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh resource-reservations
        working-directory: infra/compose/compose
      - name: Guardrail — prod rejects unpinned image tags (dev.sh fail-closed)
        if: steps.filter.outputs.code == 'true'
        # Single-source: the same script runs in the local pre-push gate,
        # so CI and local guardrails cannot drift.
        run: ../scripts/validate-guardrails.sh prod-image-tags
        working-directory: infra/compose/compose
      - name: Validate — dev + observability
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            -f docker-compose.observability.yml \
            --profile dev --profile observability config --quiet

      - name: Validate — dev + glitchtip
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            -f docker-compose.glitchtip.yml \
            --profile dev --profile glitchtip-dev config --quiet

      - name: Validate — prod + glitchtip (+ prod labels)
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production-labels.yml \
            -f docker-compose.glitchtip.yml \
            -f docker-compose.glitchtip-prod-labels.yml \
            --profile prod --profile glitchtip-prod config --quiet

      - name: Validate — dev + bullmq
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            -f docker-compose.bullmq.yml \
            --profile dev --profile bullmq config --quiet

      - name: Validate — dev + wud
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            -f docker-compose.wud.yml \
            --profile dev --profile wud config --quiet

      - name: Validate — kitchen-sink (dev + all overlays)
        if: steps.filter.outputs.code == 'true'
        working-directory: infra/compose/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.development-labels.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.glitchtip.yml \
            -f docker-compose.bullmq.yml \
            -f docker-compose.wud.yml \
            --profile dev \
            --profile observability \
            --profile glitchtip-dev \
            --profile bullmq \
            --profile wud \
            config --quiet

  shellcheck:
    name: shellcheck (scripts/)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'infra/compose/**'
              - 'scripts/**'
              - 'setup.sh'
              - 'apps/docs/public/install.sh'
              - '.github/workflows/**'

      - name: ShellCheck
        if: steps.filter.outputs.code == 'true'
        run: |
          # Strict: error on warnings, follow `source` directives.
          # Root gate scripts (scripts/ci/*, stack-*.sh, setup.sh) are the
          # repo's primary local defense — they get the same bar as infra.
          shellcheck -x -S warning \
            infra/compose/compose/dev.sh \
            infra/compose/scripts/*.sh \
            scripts/*.sh \
            scripts/ci/*.sh \
            setup.sh \
            apps/docs/public/install.sh

      - name: Installer contract (arg parsing, validation, dry run)
        if: steps.filter.outputs.code == 'true'
        # The installer is the entrypoint the whole project points at, and it
        # runs on strangers' machines via curl | sh. These assertions are cheap
        # and need no Docker and no network.
        #
        # GH_TOKEN is cleared so the scaffold path is deterministic: with a
        # token present the script would create a real repository.
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -eu
          INSTALLER=apps/docs/public/install.sh

          # curl | sh has no usable stdin, so a prompt is a hang. Guard against
          # one being reintroduced.
          if grep -nE '^[[:space:]]*read[[:space:]]' "$INSTALLER"; then
            echo "::error::install.sh contains a 'read' call; it must never prompt"
            exit 1
          fi
          if grep -n '/dev/tty' "$INSTALLER"; then
            echo "::error::install.sh references /dev/tty; it must never prompt"
            exit 1
          fi

          sh "$INSTALLER" --help >/dev/null

          # --dry-run must resolve the plan and write nothing.
          work="$(mktemp -d)"
          ( cd "$work" && sh "$GITHUB_WORKSPACE/$INSTALLER" --project acme --dry-run )
          if [ -n "$(ls -A "$work")" ]; then
            echo "::error::--dry-run wrote to disk"
            exit 1
          fi

          # --json must put parseable JSON on stdout with prose on stderr.
          ( cd "$work" && sh "$GITHUB_WORKSPACE/$INSTALLER" \
              --project acme --dry-run --json 2>/dev/null ) \
            | python3 -c 'import json,sys; json.loads(sys.stdin.read().strip())'

          # Bad input must fail with exit 2 (usage), not a stack trace, and not
          # after a remote side effect. These are exactly the names
          # scripts/rename-project.sh rejects: validating loosely here meant a
          # GitHub repo was created before the rename failed.
          for bad in "Acme Corp" "-acme" "acme-" "a" "1acme" \
                     "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; do
            if sh "$INSTALLER" --project "$bad" --dry-run >/dev/null 2>&1; then
              echo "::error::install.sh accepted invalid project name '$bad'"
              exit 1
            fi
            set +e
            sh "$INSTALLER" --project "$bad" --dry-run >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 2 ]; then
              echo "::error::'$bad' exited $rc, expected 2 (usage)"
              exit 1
            fi
          done

          # Same bound as the renamer's own regexes, so a valid name stays valid.
          sh "$INSTALLER" --project ab --dry-run >/dev/null
          sh "$INSTALLER" --project "$(printf 'a%.0s' $(seq 1 31))" --dry-run >/dev/null

          # A --dir that would need JSON or shell escaping is refused rather
          # than emitted into --json output.
          for bad_dir in 'has space' 'has"quote' 'has$var'; do
            if sh "$INSTALLER" --project acme --dir "$bad_dir" --dry-run >/dev/null 2>&1; then
              echo "::error::install.sh accepted --dir '$bad_dir'"
              exit 1
            fi
          done

          if sh "$INSTALLER" --dry-run >/dev/null 2>&1; then
            echo "::error::install.sh ran without a required --project"
            exit 1
          fi

          # --ref cannot be honoured through `gh repo create --template`, which
          # always copies the default branch, so the script takes the clone path
          # instead of silently ignoring the flag. Assert it reaches the plan.
          sh "$INSTALLER" --project acme --ref v1.2.3 --dry-run 2>&1 \
            | grep -q 'boringstack@v1.2.3' \
            || { echo "::error::--ref missing from the resolved plan"; exit 1; }

          # --dir has to reach the plan too: it used to be dropped on the gh
          # path, which orphaned the clone in ./<project>.
          sh "$INSTALLER" --project acme --dir out/nested --dry-run 2>&1 \
            | grep -q 'out/nested' \
            || { echo "::error::--dir missing from the resolved plan"; exit 1; }

          # LC_ALL=C regression guard. Under en_US.UTF-8 a case range like
          # [a-z] collates as aAbBcC and so matches uppercase, which let
          # `--project ACME` and `--domain ACME.com` pass validation and then
          # fail in the renamer after the repo existed.
          for bad in ACME Acme aCme; do
            if sh "$INSTALLER" --project "$bad" --dry-run >/dev/null 2>&1; then
              echo "::error::install.sh accepted uppercase project '$bad' (LC_ALL regression?)"
              exit 1
            fi
          done
          if sh "$INSTALLER" --project acme --domain ACME.com --dry-run >/dev/null 2>&1; then
            echo "::error::install.sh accepted an uppercase domain"
            exit 1
          fi

          # Domain validation must match the renamer per label, not just on
          # charset: "acme-.com" has a label ending in a dash and used to pass.
          # "acme.com." is the case a per-label loop misses on its own: shell
          # word splitting discards the trailing empty field, so it split into
          # two valid labels and passed, then failed the renamer.
          for bad_domain in "acme-.com" "-acme.com" "acme..com" "acme." "acme" \
                            "acme.com-" "acme.com." ".acme.com" "acme...com"; do
            if sh "$INSTALLER" --project acme --domain "$bad_domain" --dry-run >/dev/null 2>&1; then
              echo "::error::install.sh accepted invalid domain '$bad_domain'"
              exit 1
            fi
          done
          for ok_domain in "acme.com" "ac-me.com" "a.co" "acme.co.uk" "x.y.z"; do
            sh "$INSTALLER" --project acme --domain "$ok_domain" --dry-run >/dev/null \
              || { echo "::error::install.sh rejected valid domain '$ok_domain'"; exit 1; }
          done

          # Data-loss regression guard. The installer must never empty the
          # destination: an earlier version did, so --force on a non-empty
          # directory deleted the caller's files before the clone was known to
          # have succeeded. It stages beside the destination instead.
          if grep -nE 'find "\$target_dir" -mindepth|rm -rf "\$target_dir"[^/]' "$INSTALLER"; then
            echo "::error::install.sh empties \$target_dir; stage beside it instead"
            exit 1
          fi
          grep -q 'staging=' "$INSTALLER" \
            || { echo "::error::install.sh no longer stages the clone"; exit 1; }

          # The tree has to be MERGED in. A version that moved top-level entries
          # and rm -rf'd each collision deleted apps/api/my-unrelated-work.txt,
          # because the template also ships apps/. Only .git may be replaced
          # wholesale, since two object stores cannot be interleaved.
          grep -q 'cp -R "\$staging/\." "\$target_dir/"' "$INSTALLER" \
            || { echo "::error::install.sh no longer merges the tree with cp -R"; exit 1; }
          if grep -nE 'rm -rf "\$\{target_dir:\?\}/\$\{base' "$INSTALLER"; then
            echo "::error::install.sh replaces whole top-level entries; merge instead"
            exit 1
          fi

          # The destination's .git must be moved aside, never deleted before the
          # copy. An earlier version deleted it first, so a copy that then failed
          # (a file where the template has a directory, for one) destroyed the
          # caller's history. It has to be restorable until the copy succeeds.
          grep -q 'mv "\$target_dir/\.git" "\$git_backup"' "$INSTALLER" \
            || { echo "::error::install.sh must move \$target_dir/.git aside, not delete it"; exit 1; }
          grep -q 'install_ok=1' "$INSTALLER" \
            || { echo "::error::install.sh has no success flag guarding the .git restore"; exit 1; }
          if grep -nE 'rm -rf "\$\{target_dir:\?\}/\.git"' "$INSTALLER" \
               | grep -qv 'cleanup\|2>/dev/null'; then
            echo "::error::install.sh deletes \$target_dir/.git outside cleanup()"
            exit 1
          fi

          # Type conflicts have to be found before anything is written, because
          # cp fails part-way and would leave the destination half-merged.
          grep -q 'conflict by type' "$INSTALLER" \
            || { echo "::error::install.sh no longer pre-flights type conflicts"; exit 1; }

          # Signal handlers must exit. `trap cleanup EXIT INT TERM` runs cleanup
          # on the signal and then RESUMES the script, so a SIGTERM during the
          # copy restored .git and then carried on through boot and health,
          # exiting 0. Separate handlers that exit are what stop it; exiting
          # still fires the EXIT trap, so cleanup runs exactly once.
          if grep -nE '^trap .*(INT|TERM).*(INT|TERM)|^trap [^ ]+ EXIT (INT|TERM)' "$INSTALLER"; then
            echo "::error::install.sh shares one trap across EXIT and signals; signals must exit"
            exit 1
          fi
          grep -qE "^trap 'exit 130' INT" "$INSTALLER" \
            || { echo "::error::install.sh has no INT handler that exits 130"; exit 1; }
          grep -qE "^trap 'exit 143' TERM" "$INSTALLER" \
            || { echo "::error::install.sh has no TERM handler that exits 143"; exit 1; }

          # install.sh must agree with .tsforge/scaffold-manifest.json on the
          # default ref and the health URLs. apps/docs check:agent-surface
          # asserts that in build:ci; not duplicated here.

          echo "installer contract ok"

  prod-image-build:
    name: build prod images (sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Cheaper than booting the prod profile end-to-end, but still
    # exercises the actual prod Dockerfiles. Catches broken
    # multi-stage builds, missing build deps, or registry-auth
    # changes before main, instead of leaving the first breakage to
    # the post-merge release workflow.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              # Dockerfile.prod runs COPY . . — the whole app tree is
              # image input, so app-only source changes must rebuild too.
              - 'apps/api/**'
              - 'apps/ui/**'
              - 'infra/compose/**'
              - '.github/workflows/infra-compose-validate-compose.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.code == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build apps/api prod image
        if: steps.filter.outputs.code == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          file: apps/api/Dockerfile.prod
          push: false
          load: true
          tags: boringstack-api:pr-build
          cache-from: type=gha,scope=apps-api-prod
          cache-to: type=gha,scope=apps-api-prod,mode=max

      - name: Build apps/ui prod image
        if: steps.filter.outputs.code == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/ui
          file: apps/ui/Dockerfile.prod
          push: false
          load: true
          tags: boringstack-ui:pr-build
          cache-from: type=gha,scope=apps-ui-prod
          cache-to: type=gha,scope=apps-ui-prod,mode=max
          build-args: |
            VITE_API_URL=https://api.example.test

  yamllint:
    name: yamllint (compose + workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      # Single source for the yamllint pin — the local pre-push gate
      # (infra/compose/scripts/pre-push.sh) reads this value at runtime to
      # warn when the brew-installed yamllint diverges from CI.
      YAMLLINT_VERSION: "1.38.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'infra/compose/**'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: yamllint
        if: steps.filter.outputs.code == 'true'
        run: |
          pip install --user "yamllint==${YAMLLINT_VERSION}"
          # Document syntax (line length, indentation, truthy values) but
          # don't fail on style nits — only on real syntax errors.
          ~/.local/bin/yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            infra/compose/compose/ .github/workflows/
