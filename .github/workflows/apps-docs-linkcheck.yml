name: docs-linkcheck

# Builds the BoringStack docs site and runs lychee against the built output.
# Internal broken links fail the job; external 4xx/5xx are warnings only
# (rate-limited APIs and intermittent third-party 503s are not the docs'
# problem to solve at PR-review time).

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/src/**"
      - "apps/docs/scripts/**"
      - "apps/docs/astro.config.mjs"
      - "apps/docs/package.json"
      - "apps/docs/bun.lock"
      - ".github/workflows/apps-docs-linkcheck.yml"
  # PR trigger has NO `paths:` filter — the `linkcheck` check is in
  # branch protection's required-checks list, so the workflow must run
  # on every PR or branch protection will wait forever for a status
  # that never comes ("Expected — Waiting for status to be reported").
  # The expensive build + lychee steps are gated on the internal
  # paths-filter below, so PRs that don't touch docs report green
  # without doing any real work.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-docs-linkcheck-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    defaults:
      run:
        working-directory: apps/docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect docs changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            docs:
              - 'apps/docs/src/**'
              - 'apps/docs/scripts/**'
              - 'apps/docs/astro.config.mjs'
              - 'apps/docs/package.json'
              - 'apps/docs/bun.lock'
              - '.github/workflows/apps-docs-linkcheck.yml'

      - name: No-op notice for non-docs PRs
        if: steps.filter.outputs.docs != 'true'
        run: echo "No docs files changed in this PR — link check skipped."

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.filter.outputs.docs == 'true'
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        if: steps.filter.outputs.docs == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/docs/bun.lock', 'apps/ui/bun.lock', 'apps/api/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install docs deps
        if: steps.filter.outputs.docs == 'true'
        run: bun install --frozen-lockfile

      - name: Install apps/ui deps for lint-meta export
        if: steps.filter.outputs.docs == 'true'
        working-directory: apps/ui
        run: bun install --frozen-lockfile

      - name: Install apps/api deps for lint-meta export
        if: steps.filter.outputs.docs == 'true'
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: Verify generated docs data
        if: steps.filter.outputs.docs == 'true'
        env:
          BORINGSTACK_UI_DIR: ${{ github.workspace }}/apps/ui
          BORINGSTACK_API_DIR: ${{ github.workspace }}/apps/api
        run: bun run check:docs-data

      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        env:
          BORINGSTACK_UI_DIR: ${{ github.workspace }}/apps/ui
          BORINGSTACK_API_DIR: ${{ github.workspace }}/apps/api
        run: bun run build:ci

      - name: Internal link check (fail on broken)
        if: steps.filter.outputs.docs == 'true'
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --offline
            --root-dir ${{ github.workspace }}/apps/docs/dist
            '${{ github.workspace }}/apps/docs/dist/**/*.html'
          fail: true

      - name: External link check (warning only)
        if: steps.filter.outputs.docs == 'true'
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        continue-on-error: true
        with:
          # --max-retries 0 is the load-bearing flag here. This step is
          # warning-only, so a retry buys nothing — and on a shared CI runner
          # IP, github.com answers a burst of link checks with HTTP 429 +
          # a giant Retry-After. lychee honours that with a per-retry backoff
          # ("unexpectedly big rate limit backoff … capping to 1m"), which
          # serialised into a multi-minute near-hang on every run. The
          # GITHUB_TOKEN below only authenticates the parseable owner/repo
          # URLs lychee routes through api.github.com; org pages, /join and
          # template placeholders still fall back to plain HTTP and get
          # throttled. With retries disabled a throttled link surfaces as a
          # warning immediately instead of blocking the runner.
          args: >-
            --no-progress
            --max-retries 0
            --root-dir ${{ github.workspace }}/apps/docs/dist
            --exclude-path './llms-full.txt'
            --exclude-path './llms-small.txt'
            --exclude '^https?://(localhost|127\.0\.0\.1|.*\.localhost)'
            --exclude 'github\.com/boringstack-xyz/.*/(blob|tree)/'
            '${{ github.workspace }}/apps/docs/dist/**/*.html'
          fail: false
        env:
          # Authenticates the github.com links lychee can route through the
          # GitHub API (5000 req/h) instead of anonymous HTTP (60 req/h).
          # Helps, but does not cover org/placeholder URLs — see --max-retries
          # above for why that alone never stopped the backoff hang. Needs only
          # the default contents:read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
