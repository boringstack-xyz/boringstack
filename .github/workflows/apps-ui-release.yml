name: release

# Two responsibilities in one workflow:
#   1. changesets/action — opens a "Version Packages" PR or publishes when it
#      merges, creating a GitHub Release with the changeset tag.
#   2. Build + push the SPA's production image to GHCR.
#
# Image tags:
#   - every push to main       → :latest + :sha-<7>
#   - on a changesets publish  → also :<semver> (from the merged Version Packages PR)
#
# Downstream consumers (BoringStack's WUD service in the prod compose stack)
# watch ghcr.io/<owner>/<repo>-ui:latest and auto-redeploy when a new sha
# is pushed.

on:
  push:
    branches: [main]
    paths:
      - "apps/ui/**"
      - ".github/workflows/apps-ui-release.yml"

concurrency:
  group: apps-ui-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    defaults:
      run:
        working-directory: apps/ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/ui/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Opens or updates a "Version Packages" PR when changesets exist on main.
      # On merge of that PR, this same step pushes the version bump + tag and
      # creates the GitHub Release. The `published` output tells the image
      # build below whether to add a :<semver> tag.
      - name: Create Release Pull Request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: apps/ui
          version: bunx changeset version
          publish: bunx changeset tag
          createGithubReleases: true
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # Monorepo image names are suffix-based so API and UI publish distinct
          # packages from the same repository.
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-ui
          # Always produce :latest (on main) and :sha-<7>. Add the semver tag
          # only when changesets actually published a new version on this run.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ fromJSON(steps.changesets.outputs.publishedPackages || '[{"version":""}]')[0].version }},enable=${{ steps.changesets.outputs.published == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=BoringStack UI
            org.opencontainers.image.description=Vite + React + TanStack Query SPA
            wud.watch=true

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: apps/ui
          file: apps/ui/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Default empty VITE_API_URL = same-origin path routing (the SPA hits
          # /api/* on whatever host serves it). Cross-origin deployments
          # override via a downstream build arg.
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
