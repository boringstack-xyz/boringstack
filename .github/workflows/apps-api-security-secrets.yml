name: security-secrets

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/apps-api-security-secrets.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: apps-api-security-secrets-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    defaults:
      run:
        working-directory: apps/api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so gitleaks can scan every commit.
          fetch-depth: 0

      - name: Detect relevant changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'apps/api/**'
              - '.github/workflows/apps-api-security-secrets.yml'

      - name: Install gitleaks CLI
        if: steps.filter.outputs.code == 'true'
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "/tmp/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan
        if: steps.filter.outputs.code == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --exit-code=1

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7c1e4cf0b20d7c1872b26569c00ba908797a59bf # v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks-api
        continue-on-error: true
