name: release

# Builds and publishes the production image to GitHub Container Registry on:
#   - every push to main (tags: latest + sha-<7>)
#   - every push of a semver tag v*.*.* (adds the :<semver> tag, e.g. :0.3.0)
#
# Downstream consumers (BoringStack's WUD service in the prod compose stack)
# watch ghcr.io/<owner>/<repo>-api:latest and auto-redeploy when a new sha
# is pushed.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "apps/api/**"
      - ".github/workflows/apps-api-release.yml"

concurrency:
  group: apps-api-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    defaults:
      run:
        working-directory: apps/api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the `org.opencontainers.image.revision` label.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Monorepo image names are suffix-based so API and UI publish distinct
          # packages from the same repository.
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
          # WUD opts containers in via this label, so the prod compose stack
          # auto-discovers them without hardcoding image names anywhere.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=BoringStack API
            org.opencontainers.image.description=Bun + Elysia + Drizzle API
            wud.watch=true

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          file: apps/api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
