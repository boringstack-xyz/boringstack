name: bundle-diff

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ui/src/**"
      - "apps/ui/package.json"
      - "apps/ui/bun.lock"
      - "apps/ui/vite.config.ts"
      - "apps/ui/.size-limit.json"
      - ".github/workflows/apps-ui-bundle-diff.yml"

concurrency:
  group: apps-ui-bundle-diff-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  size-diff:
    # Dependabot PRs run with a read-only GITHUB_TOKEN, so the size-limit-action
    # can't post the comparison comment and fails with "Parameter token or
    # opts.auth is required". The comment isn't useful on bot bumps anyway.
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: apps/ui
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect relevant changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'apps/ui/src/**'
              - 'apps/ui/package.json'
              - 'apps/ui/bun.lock'
              - 'apps/ui/vite.config.ts'
              - 'apps/ui/.size-limit.json'
              - '.github/workflows/apps-ui-bundle-diff.yml'

      # size-limit-action runs install + build on both the PR branch and
      # the base branch internally so it can diff bundle sizes. We let
      # it manage its own lifecycle — pre-installing with bun and then
      # setting `skip_step: install` puts the action onto a code path in
      # v1.8.0 that exec()s the script string as a binary instead of via
      # `npm run`, failing post-build with
      # "Unable to locate executable file: build". Letting the action
      # run `npm install` itself adds ~20s but keeps it on the tested
      # path. apps/ui's bun lockfile is npm-compatible, so npm install
      # resolves the same tree.
      - name: Comment with bundle-size diff
        if: steps.filter.outputs.code == 'true'
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # v1.8.0 doesn't reliably fall back to env GITHUB_TOKEN — it
          # initialises Octokit before reading the env, so the token must
          # be passed explicitly as a `with:` input.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action's exec() subprocess does NOT inherit the job-level
          # `defaults.run.working-directory`. Pinning `directory: apps/ui`
          # is what makes both `npm install` and `npm run build` resolve
          # against the UI's package.json instead of the repo root.
          directory: apps/ui
          package_manager: npm
          script: build
