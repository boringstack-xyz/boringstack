name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/ui/**"
      - ".github/workflows/apps-ui-validate.yml"

concurrency:
  group: apps-ui-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    defaults:
      run:
        working-directory: apps/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: apps/ui/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Lint + format + typecheck
        run: pnpm check

      - name: Unit + integration tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size:check

      - name: Modulepreload size coverage
        run: pnpm size:check:modulepreload

      - name: Lighthouse CI (a11y + best-practices + SEO + perf budgets)
        run: pnpm exec lhci autorun

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

      # NOTE: Playwright report upload lives in full-stack-smoke.yml in the
      # infra-docker-compose-template repo, where E2E actually runs.

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
