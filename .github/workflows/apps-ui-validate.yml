name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/ui/**"
      - ".github/workflows/apps-ui-validate.yml"

concurrency:
  group: apps-ui-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    defaults:
      run:
        working-directory: apps/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit --audit-level high

      - name: Lint + format + typecheck
        run: bun run check

      - name: Unit + integration tests
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Bundle size budget
        run: bun run size:check

      - name: Modulepreload size coverage
        run: bun run size:check:modulepreload

      - name: Lighthouse CI (a11y + best-practices + SEO + perf budgets)
        run: bunx lhci autorun

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

      # NOTE: Playwright report upload lives in full-stack-smoke.yml in the
      # infra-docker-compose-template repo, where E2E actually runs.

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
