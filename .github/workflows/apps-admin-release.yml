name: release

# Builds and publishes the operator dashboard's serving image to GitHub
# Container Registry on every push to main that touches apps/admin (tags:
# latest + sha-<7>), for the Compose/WUD path. The dashboard is opt-in
# (WITH_ADMIN) and LAN-only, so Kubernetes never pins this image: the k3s
# production release builds the public four and leaves the admin overlay out.
# The overlay is still rendered in infra-k3s-validate.yml.

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/apps-admin-release.yml"

concurrency:
  group: apps-admin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=BoringStack operator dashboard
            org.opencontainers.image.description=LAN-only operator dashboard served by nginx
            wud.watch=true

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/admin
          file: apps/admin/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-admin
          cache-to: type=gha,scope=release-admin,mode=max
