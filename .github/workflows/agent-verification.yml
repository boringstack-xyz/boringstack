name: agent-verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/ci/**"
      - "infra/compose/compose/dev.sh"
      - "infra/compose/scripts/pre-push.sh"
      - "apps/api/**"
      - "apps/ui/**"
      - "apps/docs/scripts/copy-scaffold-manifest.mjs"
      - "apps/docs/public/account-resource.json"
      - ".tsforge/scaffold-manifest.json"
      - "package.json"
      - ".github/workflows/agent-verification.yml"
      - ".github/workflows/apps-api-ci.yml"
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    name: agent verification contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            tooling:
              - 'tools/**'
              - 'scripts/ci/**'
              - 'infra/compose/compose/dev.sh'
              - 'infra/compose/scripts/pre-push.sh'
              - 'apps/api/**'
              - 'apps/ui/**'
              - 'apps/docs/scripts/copy-scaffold-manifest.mjs'
              - 'apps/docs/public/account-resource.json'
              - '.tsforge/scaffold-manifest.json'
              - 'package.json'
              - '.github/workflows/agent-verification.yml'
              - '.github/workflows/apps-api-ci.yml'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.changes.outputs.tooling == 'true'
        with:
          bun-version: 1.4.0
      - name: Cache Bun dependencies
        if: steps.changes.outputs.tooling == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/api/bun.lock', 'apps/ui/bun.lock') }}
      - name: Install verification dependencies
        if: steps.changes.outputs.tooling == 'true'
        run: |
          cd apps/api
          bun install --frozen-lockfile
          cd ../ui
          bun install --frozen-lockfile
      - name: Verify evidence and real generator behavior
        if: steps.changes.outputs.tooling == 'true'
        run: bun run agent:check
      - name: Verify isolated infrastructure
        if: steps.changes.outputs.tooling == 'true'
        run: bun run agent:check:docker
      - name: Install Chromium for reference acceptance
        if: steps.changes.outputs.tooling == 'true'
        working-directory: apps/ui
        run: bunx playwright install --with-deps chromium
      - name: Verify independent acceptance judge
        if: steps.changes.outputs.tooling == 'true'
        run: bun run agent:eval --deterministic
