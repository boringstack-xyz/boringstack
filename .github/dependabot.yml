version: 2
updates:
  # apps/api + apps/ui share a class of dev tooling (ESLint, TypeScript,
  # Prettier, knip, husky, the typescript-eslint family, and the first-party
  # @boring-stack-pkg/* plugins) that the `shared-tool-version-parity`
  # lint-meta rule REQUIRES to be pinned to one identical version in every app
  # that declares it. A per-app bump (e.g. unicorn in apps/ui only) drifts the
  # two apps apart and can never pass CI on its own.
  #
  # Both apps therefore live in a single multi-directory update config so the
  # `dev-tooling` group below proposes ONE cross-directory PR that moves the
  # shared toolchain in lockstep across api and ui. App-specific groups still
  # scope to whichever directory actually declares the package.
  - package-ecosystem: bun
    directories:
      - /apps/api
      - /apps/ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 12
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    groups:
      # Parity-controlled shared dev tooling — keep in sync with the
      # SHARED_TOOLS list in
      # apps/api/scripts/lint-meta/rules/supply-chain/shared-tool-version-parity.ts.
      # Spans both directories so a bump lands as a single lockstep PR.
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@eslint-community/*"
          - "typescript-eslint"
          - "typescript"
          - "prettier"
          - "prettier-plugin-*"
          - "@trivago/*"
          - "knip"
          - "husky"
          - "@boring-stack-pkg/*"
      # apps/api-specific groups
      elysia:
        patterns: ["elysia", "@elysiajs/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      typebox:
        patterns: ["@sinclair/typebox"]
      bullmq:
        patterns: ["bullmq", "ioredis"]
      stripe:
        patterns: ["stripe"]
      email:
        patterns:
          - "resend"
          - "@sendgrid/mail"
          - "nodemailer"
          - "@types/nodemailer"
          - "handlebars"
      ai:
        patterns: ["@anthropic-ai/sdk", "openai"]
      # apps/ui-specific groups
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router-dom"
      tanstack:
        patterns: ["@tanstack/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "@playwright/test"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      tailwind-shadcn:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
          - "class-variance-authority"
          - "tailwind-merge"
          - "clsx"
          - "radix-ui"
          - "@radix-ui/*"
          - "lucide-react"
          - "sonner"
          - "next-themes"
      # @sentry/* is declared in both apps; the shared group keeps the two
      # Sentry SDKs aligned in a single PR (not parity-enforced, but tidy).
      observability:
        patterns:
          - "@sentry/*"
          - "pino"
          - "pino-pretty"
          - "size-limit"
          - "@size-limit/*"
          - "@lhci/*"
    ignore:
      # apps/api majors held back
      - dependency-name: "elysia"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # apps/ui majors held back
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # shared
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /apps/docs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/cloudflare 13.x requires Astro 6 (uses astro/app/manifest
      # which is not exported by Astro 5). Stay on 12.x until we bump Astro.
      - dependency-name: "@astrojs/cloudflare"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra/compose/compose
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
      - dependency-name: "traefik"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(tofu)"
