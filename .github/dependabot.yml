version: 2
updates:
  - package-ecosystem: bun
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    # Catch-all grouping. The previous per-family groups (elysia, drizzle,
    # bullmq, email, lint, observability, ai, …) were an allowlist: anything
    # not named fell through as its own PR, so a normal week produced ~20
    # single-package PRs (four separate @opentelemetry/* ones, `knip` once per
    # app, and so on) and the named list needed extending for every new dep.
    # Matching "*" by dependency-type caps this at two PRs per app — runtime
    # deps kept separate from tooling so review risk stays distinguishable.
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      - dependency-name: "elysia"
        update-types: ["version-update:semver-major"]
      # elysia-rate-limit 5.x requires `elysia >= 2.0.0`, but Elysia has no
      # stable 2.0.0 — the 2.x line exists only under the `next`/`experimental`
      # dist-tags, and `elysia` itself is major-ignored just above. Stay on
      # 4.6.2 (peer `elysia >= 1.0.0`) until Elysia 2 ships stable and we do
      # that upgrade deliberately.
      - dependency-name: "elysia-rate-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /apps/ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    # Catch-all grouping — see the rationale on the apps/api block above.
    # Note this keeps React's own pins together: react, react-dom and
    # react-router-dom are production, while @types/react and
    # @types/react-dom are development, so they land in sibling PRs. The
    # `overrides` entries mirroring them still have to move in lockstep;
    # the package-override-parity lint-meta rule catches it if they drift.
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /apps/docs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    # This block had no groups at all, so every docs dep (astro, starlight,
    # wrangler, ws, mermaid …) arrived as its own PR.
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      # @astrojs/cloudflare 13.x requires Astro 6 (uses astro/app/manifest
      # which is not exported by Astro 5). Stay on 12.x until we bump Astro.
      - dependency-name: "@astrojs/cloudflare"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    # One PR for all action bumps. dependency-type doesn't apply to this
    # ecosystem, so a single "*" group is the equivalent.
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # changesets/action 2.x requires Changesets CLI v3 and validates it at
      # runtime, directing CLI v2 users back to @v1. apps/ui is on
      # @changesets/cli 2.31.0. v2 also renames every input and removes
      # `cwd`, which the monorepo layout relies on (.changeset lives in
      # apps/ui, not the repo root). Revisit together with the CLI v3
      # upgrade, not as a dependency bump.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra/compose/compose
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
      - dependency-name: "traefik"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(tofu)"
    groups:
      terraform-providers:
        patterns: ["*"]
