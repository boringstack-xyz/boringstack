[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "yaml",
  "@tailwindcss/oxide",
  "@tailwindcss/oxide*",
  "tmp",
  # form-data 4.0.6 / undici 7.28.0 patch GHSA-hmw2-7cc7-3qxx and
  # GHSA-vmh5-mc38-953g respectively; both patched releases are <7 days old,
  # so exempt them from the quarantine window. Build-time tooling only.
  "form-data",
  "undici",
  # nanoid 3.3.18 patches GHSA-2v37-7h3g-55p8. Pulled in transitively by
  # postcss (build-time CSS tooling); the patched release is <7 days old, so
  # exempt it from the quarantine window.
  "nanoid",
]
