# osv-scanner accepted-risk allowlist for the boringstack-xyz docs
# site (Astro Starlight static-site generator).
#
# Risk surface: this repo builds a static documentation site (HTML/CSS/JS
# only) served via Cloudflare Pages. There is no runtime authentication,
# no server-side request handling, no database, no user input processing.
# All listed CVEs affect dev/build-time tooling; the published artifact
# does not ship them as exploitable surface.
#
# Re-evaluate quarterly via `bun run update` to drop entries that newer
# transitive versions have patched.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = "2026-11-18T00:00:00Z"
reason = """
braces 3.0.3 (no fixed release yet). Reached only through micromatch 4.0.5 in
the Astro/Starlight build toolchain. Build-time pattern matching over repo
files; never in the published static output and never reached by user input.
Remove once braces is patched.
"""

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = "2026-11-18T00:00:00Z"
reason = """
http-cache-semantics 4.2.0 max-stale cache disclosure (no fixed release). Pulled
in by astro's build-time dependency graph. The vulnerable path needs a shared
HTTP cache serving several users; this build runs in CI with no shared cache,
and the deployed site is static Cloudflare Pages output. Remove once astro
moves to a patched http-cache-semantics.
"""
