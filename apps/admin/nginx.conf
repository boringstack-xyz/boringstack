# Static server for the operator dashboard, plus a same-origin proxy to the
# LAN-only admin API. The browser sees one origin, so the admin API's
# cross-site guard (sec-fetch-site) accepts the dashboard's requests and
# refuses everything else. Nothing here is meant for the public internet:
# the Compose and k3s targets bind it to the LAN only.
#
# The resolver comes from docker-entrypoint.d/10-admin-resolver.sh (written to
# /tmp/nginx/resolver.conf at container start), and the upstream is a variable,
# so nginx starts even when admin-api is not up yet.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /tmp/nginx/resolver.conf;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $admin_api_upstream http://admin-api:7340;
    proxy_pass $admin_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
