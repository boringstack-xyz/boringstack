version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm dependencies (Bun-managed via package.json)
  # ---------------------------------------------------------------------------
  # The `package-json-exact-deps` lint rule (and AGENTS.md) require:
  #   - dependencies / devDependencies pinned exactly (no ^, no ~)
  #   - peerDependencies use ^
  # The `versioning-strategy: increase` option matches that — Dependabot
  # rewrites the version literal in package.json instead of widening a range.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    versioning-strategy: increase
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # Align with .npmrc minimum-release-age (10080 minutes = 7 days) so Dependabot
    # PRs do not fail CI on freshly published registry versions.
    cooldown:
      default-days: 7

    # Group related ecosystem bumps so we don't drown in single-package PRs.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@playwright/test"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      tailwind-shadcn:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
          - "class-variance-authority"
          - "tailwind-merge"
          - "clsx"
          - "radix-ui"
          - "@radix-ui/*"
          - "lucide-react"
          - "sonner"
          - "next-themes"
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "@trivago/*"
      observability:
        patterns:
          - "@sentry/*"
          - "size-limit"
          - "@size-limit/*"
          - "@lhci/*"

    # Major bumps for ecosystem-load-bearing libs: handle by hand, not by bot.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep pinned by SHA via the `github-actions-permissions`
  # rule. Dependabot updates the SHA and re-comments the version tag.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  # ---------------------------------------------------------------------------
  # Docker base images (Dockerfile + Dockerfile.prod). The recommended workflow
  # is to digest-pin upstream tags (`node:22-alpine@sha256:...`) so changes are
  # explicit. Dependabot bumps the digest when the upstream tag advances.
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    # Node major bumps are handled by hand. We track LTS only (even-numbered
    # majors that have crossed into Active LTS); Dependabot doesn't know the
    # difference and would happily propose Node 25/26 the day they ship.
    # Patch + minor bumps on the pinned major still flow through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
