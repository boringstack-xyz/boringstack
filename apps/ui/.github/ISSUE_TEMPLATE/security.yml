name: Security report
description: Suspected vulnerability or hardening gap
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste exploit code or live credentials here.**

        For active vulnerabilities, email `security@example.com` (see
        SECURITY.md) instead of filing a public issue.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: "CSP allows 'unsafe-inline' for style-src"
    validations:
      required: true

  - type: textarea
    id: surface
    attributes:
      label: Affected surface
      description: Which file / config / endpoint / lint rule is at fault.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Potential impact
      placeholder: "An XSS payload in user-supplied content could execute due to inline styles."
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Suggested remediation
      placeholder: "Switch to CSP nonces; document migration in SECURITY.md."

  - type: dropdown
    id: severity
    attributes:
      label: Suspected severity
      options:
        - low — defense-in-depth gap, no known exploit
        - medium — exploitable under uncommon conditions
        - high — exploitable on the default config
        - critical — actively being exploited
    validations:
      required: true
