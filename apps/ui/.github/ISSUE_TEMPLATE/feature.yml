name: Feature request
description: New behavior or template addition
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: "Add a useDebounce hook to lib/hooks for canonical debouncing"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Concrete user/agent pain. Skip if it's a polish change.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: API sketch, file paths, integration points. Doesn't need to be final.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "lodash.debounce — already a dep; rejected because it bypasses React's render cycle."

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is a new ESLint rule / convention enforcement.
        - label: This adds or modifies a Vitest / Playwright / Storybook pattern.
        - label: This is a new shadcn primitive or a `core/`/`global/` component.
        - label: This is a new feature folder under `src/features/`.
        - label: This is a tooling / CI change.
