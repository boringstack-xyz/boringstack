# Static file server for the production SPA build.
#
# Single responsibility: serve /usr/share/nginx/html, fall back to index.html
# for client-side routes, set Cache-Control per location. Everything else —
# security headers, CSP, HSTS, compression — comes from Traefik in front.
#
# In dev, this file is unused: Vite's dev server serves the SPA directly
# from localhost:3001 (or the Vite port configured in vite.config.ts).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames into /assets/, so these can be cached
  # forever. New deploys produce new filenames; old ones stay reachable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback for client-side routes. The shell must be revalidated on
  # every request so a new deploy is picked up immediately.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Container-level liveness probe. External health checks should hit
  # /health on the api router instead.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
