[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "yaml",
  "@tailwindcss/oxide",
  "@tailwindcss/oxide*",
  "@boring-stack-pkg/eslint-plugin-code-flow",
  "@boring-stack-pkg/eslint-plugin-comment-hygiene",
  "@boring-stack-pkg/eslint-plugin-env-access",
  "@boring-stack-pkg/eslint-plugin-i18n-keys",
  "@boring-stack-pkg/eslint-plugin-module-boundaries",
  "@boring-stack-pkg/eslint-plugin-react-component-architecture",
  "@boring-stack-pkg/eslint-plugin-resource-architecture",
  "@boring-stack-pkg/eslint-plugin-structured-logging",
  "@boring-stack-pkg/eslint-plugin-tanstack-query-cache",
  "@boring-stack-pkg/eslint-plugin-test-conventions",
  # ESLint 10 support landed in typescript-eslint 8.60.0 (2026-05-25); the
  # earlier 8.59.4 imports `LegacyESLint` which ESLint 10 removed. Exempt
  # the family from the 7-day quarantine for this one upgrade window.
  "typescript-eslint",
  "@typescript-eslint/eslint-plugin",
  "@typescript-eslint/parser",
  "@typescript-eslint/scope-manager",
  "@typescript-eslint/type-utils",
  "@typescript-eslint/types",
  "@typescript-eslint/typescript-estree",
  "@typescript-eslint/utils",
  "@typescript-eslint/visitor-keys",
  "@typescript-eslint/project-service",
  "@typescript-eslint/tsconfig-utils",
  # tmp 0.2.7 patches GHSA-7c78-jf6q-g5cm (type-confusion path traversal);
  # 0.2.6 also patched the earlier GHSA-ph9p-34f9-6g65. Pulled in transitively
  # by @lhci/cli; 0.15.1 is the latest @lhci/cli so we override `tmp` directly
  # to clear `bun audit`.
  "tmp",
  # undici 7.29.0 patches GHSA-vmh5-mc38-953g (TLS cert-validation bypass) and
  # GHSA-pr7r-676h-xcf6, plus the GHSA-4cwx-7wf7-3272 / GHSA-8xcm-r25x-g524 /
  # GHSA-jr45-8vmc-qm54 / GHSA-m8rv-5g2x-5cg5 / GHSA-v3r7-h72x-cjcm batch.
  # Pulled in transitively by jsdom (test env only); the patched release is
  # <7 days old, so exempt it from the quarantine window.
  "undici",
  # nanoid 3.3.18 patches GHSA-2v37-7h3g-55p8. Pulled in transitively by
  # postcss (build-time CSS tooling); the patched release is <7 days old, so
  # exempt it from the quarantine window.
  "nanoid",
]
