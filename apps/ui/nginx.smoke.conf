# Smoke-profile nginx config for the compose stack.
#
# Mirrors the production `nginx.conf` for static-asset serving (immutable
# /assets/ caching, SPA fallback, healthz probe) but adds a `/api/*`
# reverse proxy to `api-dev:7330` because the smoke stack does NOT run
# Traefik in front of the UI — every request lands on this nginx and
# this nginx is the only thing that knows how to reach the API.
#
# In real prod, Traefik path-routes `/api/*` to the api container before
# requests reach the UI nginx, so `nginx.conf` (the prod variant)
# deliberately has no /api block. Keeping the two files separate makes
# the routing model explicit per environment instead of relying on
# env-substituted upstreams.

upstream boringstack_api {
  server api-dev:7330;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames into /assets/.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Proxy /api/* to the API container on the docker frontend network.
  # Cookies pass through transparently. SSE / streaming responses need
  # buffering off so /api/v1/notifications/stream (and similar) flush
  # promptly; turning it off globally for /api is the simplest correct
  # choice in a smoke environment.
  location /api/ {
    proxy_pass http://boringstack_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # SPA fallback for client-side routes. No cache on the shell — a new
  # deploy must be picked up on the next navigation.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Container-level liveness probe. External health checks should hit
  # /api/health on the api router instead.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
