# osv-scanner accepted-risk allowlist.
#
# Each entry must include the reasoning + a re-evaluation date. Re-run
# `osv-scanner --lockfile=bun.lock` periodically to confirm each
# remains accepted-risk (upstream patches eventually land and the entry
# can be removed).

[[IgnoredVulns]]
id = "GHSA-28wg-ghj8-5hjv"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
nanoid@5.1.5 exact-pinned by estimo@3.0.5, which reaches us only through
@size-limit/time. Bun does not support scoped overrides, and a flat nanoid
override would drag postcss onto the ESM-only 5.x line and break the build.
size-limit runtime estimation is CI/dev tooling; no nanoid 5.x copy ships in
the UI bundle. Re-evaluate when estimo advances its nanoid pin.
"""

[[IgnoredVulns]]
id = "GHSA-2v37-7h3g-55p8"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
Same estimo@3.0.5 -> nanoid@5.1.5 pin as GHSA-28wg-ghj8-5hjv. The postcss-side
3.x copy is patched via the 3.3.18 resolution; only the CI-only size-limit
timing path remains. Re-evaluate when estimo advances its nanoid pin.
"""

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
extract-zip@2.0.1 has no patched release published. Pulled in transitively via
@puppeteer/browsers under estimo/find-chrome-bin, i.e. the size-limit and
Lighthouse CI toolchain that downloads a Chrome binary. Build/CI-only; the
archives extracted are release artifacts fetched from Google's CDN, not
user-supplied input. Re-evaluate when extract-zip ships a fix.
"""

[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
extract-zip arbitrary file write via symlink archive entries, affecting
<=2.0.1 with no patched release published — the same unfixable dependency as
GHSA-jmr9-qjv8-65gv. Reaches us only through @puppeteer/browsers under both
@lhci/cli and estimo, i.e. the size-limit and Lighthouse CI toolchain that
unpacks a Chrome download. Build/CI-only; the archives are release artifacts
fetched from Google's CDN, not user-supplied input. Re-evaluate when
extract-zip ships a fix.
"""

[[IgnoredVulns]]
id = "GHSA-xwg4-73v4-xw9w"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
Same estimo@3.0.5 -> nanoid@5.1.5 exact pin as GHSA-28wg-ghj8-5hjv and
GHSA-2v37-7h3g-55p8; this advisory covers the 4.0.0-5.1.11 integer-overflow
range that the same pinned copy falls into. Reaches us only through
@size-limit/time, i.e. CI/dev timing tooling, and no nanoid 5.x copy ships in
the UI bundle. A flat override cannot fix it — postcss needs the CJS 3.x line.
Re-evaluate when estimo advances its nanoid pin.
"""

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
zod 3.25.76 memory exhaustion on oversized constrained collections. The fix
exists only on the 4.x line (4.6.6); there is no patched 3.x release. This copy
comes from chromium-bidi 8.0.0 under the puppeteer that size-limit and
Lighthouse CI drive, where it parses protocol messages from the local headless
Chrome. Build/CI-only and never in the bundle; the UI's own zod is 4.6.7. A
flat override is not possible because apps/api must stay on 3.x for
@elysiajs/swagger and the override-parity rule mirrors pins across apps.
Remove when the puppeteer chain moves to a zod 4 based chromium-bidi.
"""
