# osv-scanner accepted-risk allowlist.
#
# Each entry must include the reasoning + a re-evaluation date. Re-run
# `osv-scanner --lockfile=bun.lock` periodically to confirm each
# remains accepted-risk (upstream patches eventually land and the entry
# can be removed).

[[IgnoredVulns]]
id = "GHSA-952p-6rrq-rcjv"
ignoreUntil = "2026-11-18T00:00:00Z"
reason = """
micromatch ReDoS. Pulled in via vite/jest tooling. Requires
attacker-controlled glob patterns reaching micromatch; our UI never
exposes glob handling to user input. Awaiting upstream patch in the
transitive tree.
"""

[[IgnoredVulns]]
id = "GHSA-48c2-rrv3-qjmp"
ignoreUntil = "2026-11-18T00:00:00Z"
reason = """
yaml prototype-pollution. Used only at build time via configuration
loaders (vite plugins). Production bundle ships no yaml parser to the
client. Awaiting upstream patch.
"""

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = "2026-11-22T00:00:00Z"
reason = """
uuid@8.3.2 pulled in transitively via @lhci/cli (Lighthouse CI). The
vulnerable code path is never reached from shipped UI code; @lhci/cli
is build/CI-only tooling. Re-evaluate when @lhci/cli bumps uuid.
"""

[[IgnoredVulns]]
id = "GHSA-28wg-ghj8-5hjv"
ignoreUntil = "2026-11-13T00:00:00Z"
reason = """
nanoid@5.1.5 exact-pinned by estimo@3.0.5, which reaches us only through
@size-limit/time. Bun does not support scoped overrides, and a flat nanoid
override would drag postcss onto the ESM-only 5.x line and break the build.
size-limit runtime estimation is CI/dev tooling; no nanoid 5.x copy ships in
the UI bundle. Re-evaluate when estimo advances its nanoid pin.
"""

[[IgnoredVulns]]
id = "GHSA-2v37-7h3g-55p8"
ignoreUntil = "2026-11-13T00:00:00Z"
reason = """
Same estimo@3.0.5 -> nanoid@5.1.5 pin as GHSA-28wg-ghj8-5hjv. The postcss-side
3.x copy is patched via the 3.3.18 resolution; only the CI-only size-limit
timing path remains. Re-evaluate when estimo advances its nanoid pin.
"""

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = "2026-11-13T00:00:00Z"
reason = """
extract-zip@2.0.1 has no patched release published. Pulled in transitively via
@puppeteer/browsers under estimo/find-chrome-bin, i.e. the size-limit and
Lighthouse CI toolchain that downloads a Chrome binary. Build/CI-only; the
archives extracted are release artifacts fetched from Google's CDN, not
user-supplied input. Re-evaluate when extract-zip ships a fix.
"""
