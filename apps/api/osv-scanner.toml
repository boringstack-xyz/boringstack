ignoreUntil = "2027-01-15T00:00:00Z"
reason = """
zod 3.25.76 memory exhaustion on oversized constrained collections. The fix
exists only on the 4.x line (4.6.6); there is no patched 3.x release. This copy
comes from @scalar/types under @elysiajs/swagger 1.3.1 (its latest release),
and forcing zod 4 onto it breaks the plugin (`z.function().returns` is gone).
It parses the app's own static Swagger UI configuration, never request input,
and Swagger is mounted in development only. The app's own zod is 4.6.7.
Remove when @elysiajs/swagger moves to a zod 4 based @scalar/types.
"""
