# gitleaks configuration — extends the default rule set with a small allowlist
# for known false positives in tests and guardrail source.
#
# Rationale: tests for the Web Push pipeline construct push subscription
# objects with hand-rolled `p256dhKey` / `authKey` values like "secret-p256dh-key".
# These aren't real keys (real ones are base64url-encoded P-256 EC public points
# from the browser); the gitleaks `generic-api-key` rule misclassifies the
# high-entropy literal strings as leaked secrets.
#
# Allowlist scope is intentionally narrow:
# - two notification push test files with synthetic Web Push key fixtures;
# - one lint-meta rule file with the literal workspace marker `infra/compose`,
#   which the default `generic-api-key` rule misclassifies in git history.
# Production code with the same pattern would still fail the scan.

[extend]
useDefault = true

[allowlist]
description = "Web Push test fixtures use placeholder p256dhKey / authKey strings; never real secrets."
paths = [
  '''apps/api/tests/api/notifications/notifications\.push\.utils\.test\.ts''',
  '''apps/api/tests/api/notifications/notifications\.push\.service\.test\.ts''',
  '''apps/ui/scripts/lint-meta/rules/source-text/no-cross-repo-import\.ts''',
]
